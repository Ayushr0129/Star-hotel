{% extends "base.html" %}
{% load static %}
{% block title %}Support - Star Hotel{% endblock %}
{% block content %}
 
    <div class="layout">
 
        <aside class="sidebar">
            <div class="profile">
                <div class="avatar"></div>
                <div class="profile-info">
                    <div class="name">Name</div>
                    <div class="member">Gold member</div>
                </div>
            </div>
 
            <nav id="nav">
                <div class="nav-highlight" id="navHighlight"></div>
                <a href="{% url 'customer_dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'customer_dashboard' %}active{% endif %}">Dashboard</a>
                <a href="{% url 'customer_profile' %}" class="nav-item {% if request.resolver_match.url_name == 'customer_profile' %}active{% endif %}">Profile</a>
                <a href="{% url 'customer_rewards' %}" class="nav-item {% if request.resolver_match.url_name == 'customer_rewards' %}active{% endif %}">Rewards</a>
                <a href="{% url 'customer_support' %}" class="nav-item {% if request.resolver_match.url_name == 'customer_support' %}active{% endif %}">Support</a>
            </nav>
 
            <hr class="divider">
 
            <a href="#" class="logout">Logout</a>
        </aside>
 
        <div class="dashboard-content">
            <div class="content-header">
                <h1>Support</h1>
                <a href="{% url 'home' %}" class="btn-home">HOME</a>
            </div>
 
            <h2 class="section-title">Contact Us</h2>
 
            <form method="post" class="search-bar" style="margin-top:0;">
                {% csrf_token %}
                <div class="search-field" style="flex:1 1 100%;">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="What do you need help with?">
                </div>
                <div class="search-field" style="flex:1 1 100%;">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" style="padding:10px 12px; border:1px solid #b8d4f0; border-radius:6px; font-size:14px; font-family:inherit;"></textarea>
                </div>
                <div class="search-field" style="flex:0 0 auto;">
                    <button type="submit" class="btn-checkout" style="width:auto; padding:12px 28px;">Send Message</button>
                </div>
            </form>
 
            <h2 class="section-title" style="margin-top:32px;">Other Ways to Reach Us</h2>
            <div class="past-booking-row">
                <div>
                    <div class="past-booking-name">Phone</div>
                    <div class="past-booking-dates">+230 000 0000</div>
                </div>
            </div>
 
        </div>
 
    </div>
 
    <script src="{% static 'js/script.js' %}"></script>
 
{% endblock %}
