{% extends "base.html" %}

{% block title %}

Register

{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/auth.css' %}">

<section class="auth-page register-page">
    <div class="register-card">
        <img class="torn torn--tr" src="{% static 'images/torn-corner.svg' %}" alt="">
        <img class="stars stars--tl" src="{% static 'images/stars-cluster.svg' %}" alt="">
        <img class="stars stars--br-card" src="{% static 'images/stars-cluster.svg' %}" alt="">

        <h1 class="auth-title"><span>Create</span> Account</h1>

        <form method="post" class="register-form">
            {% csrf_token %}
            <div class="row-2">
                <div class="float-field">
                    <label for="first_name">First Name</label>
                    <input id="first_name" type="text" name="first_name" autocomplete="given-name" required>
                </div>
                <div class="float-field">
                    <label for="last_name">Last Name</label>
                    <input id="last_name" type="text" name="last_name" autocomplete="family-name" required>
                </div>
            </div>
            <div class="float-field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
            </div>
            <div class="float-field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn-create">Create Account</button>
        </form>

        <p class="have-account">Already have an account? <a href="#">Login</a></p>

        <div class="or-divider or-divider--wide"><span>Or</span></div>

        <div class="row-2 socials">
            <a class="social-btn" href="#">
                <img src="{% static 'images/facebook.svg' %}" alt="" width="20" height="20"> Sign up with Facebook
            </a>
            <a class="social-btn" href="#">
                <img src="{% static 'images/google.svg' %}" alt="" width="18" height="18"> Sign up with Google
            </a>
        </div>
    </div>
</section>

{% endblock %}
