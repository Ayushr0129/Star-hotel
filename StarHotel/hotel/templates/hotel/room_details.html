{% extends "base.html" %}
{% load static %}

{% block title %}
Deluxe Room | Star Hotel
{% endblock %}

{% block content %}

<div class="room-details-page">
    <div class="room-header">
        <h1 class="room-name">Deluxe Room</h1>
        <span class="room-rating">★★★★★</span>
    </div>

    <div class="room-details-layout">
        <div class="room-gallery">
            <div class="room-main-image">
                <img src="{% static 'images/deluxe.jpg' %}" alt="Deluxe Room">
            </div>

            <div class="room-thumbnails">
                <img src="{% static 'images/deluxe-thumb-1.jpg' %}" alt="Deluxe Room thumbnail 1">
                <img src="{% static 'images/deluxe-thumb-2.jpg' %}" alt="Deluxe Room thumbnail 2">
                <img src="{% static 'images/deluxe-thumb-3.jpg' %}" alt="Deluxe Room thumbnail 3">
                <img src="{% static 'images/deluxe-thumb-4.jpg' %}" alt="Deluxe Room thumbnail 4">
            </div>
        </div>

        <div class="room-info-panel">
            <!-- price, capacity, amenities, booking form go here next -->
        </div>
    </div>
</div>

{% endblock %}
