{% extends "base.html" %}
{% load static %}
{% block title %}Payment - Star Hotel{% endblock %}
{% block content %}
 
<div class="checkout-container">
 
    <div class="checkout-layout">
        <div class="checkout-main">
 
            <div class="form-section">
                <h2>Payment Details</h2>
 
                <form method="post">
                    {% csrf_token %}
 
                    <div class="form-field" style="margin-bottom:16px;">
                        <label for="card_number">Card Number</label>
                        <input type="text" id="card_number" name="card_number" placeholder="0000 0000 0000 0000">
                    </div>
 
                    <div class="form-row">
                        <div class="form-field">
                            <label for="expiry">Expiry</label>
                            <input type="text" id="expiry" name="expiry" placeholder="MM/YY">
                        </div>
                        <div class="form-field">
                            <label for="cvc">CVC</label>
                            <input type="text" id="cvc" name="cvc" placeholder="123">
                        </div>
                    </div>
 
                    <div class="form-field" style="margin-bottom:8px;">
                        <label for="card_name">Name on card</label>
                        <input type="text" id="card_name" name="card_name">
                    </div>
                </form>
            </div>
 
            <div class="form-section">
                <h2>Billing Address</h2>
 
                <div class="form-field" style="margin-bottom:16px;">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address">
                </div>
 
                <div class="form-row">
                    <div class="form-field">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city">
                    </div>
                    <div class="form-field">
                        <label for="postal_code">Postal Code</label>
                        <input type="text" id="postal_code" name="postal_code">
                    </div>
                </div>
 
                <div class="checkbox-row">
                    <input type="checkbox" id="agree" name="agree">
                    <label for="agree">I agree to the cancellation policy. Rooms: free cancellation until 48hrs before check-in. Events: 50% deposit non-refundable.</label>
                </div>
            </div>
 
        </div>
 
        <div class="order-summary">
            <h3>ORDER SUMMARY</h3>
            <div class="order-row"><span>Room</span><span>Rs 15 000</span></div>
            <hr class="order-divider">
            <div class="order-row"><span>Subtotal</span><span>Rs 15 000</span></div>
            <div class="order-row"><span>Taxes</span><span>Rs 1 000</span></div>
            <div class="order-total"><span>Total</span><span>Rs 16 000</span></div>
        </div>
    </div>
 
    <div class="checkout-actions">
        <a href="{% url 'cart_guest_details' %}" class="btn-outline-navy">Back</a>
        <a href="{% url 'booking_confirmation' %}" class="btn-checkout" style="width:auto; padding:12px 32px;">Pay Rs 16 000</a>
    </div>
</div>
 
{% endblock %}
