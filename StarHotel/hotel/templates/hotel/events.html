{% extends "base.html" %}
{% load static %}

{% block title %}Events - Star Hotel{% endblock %}

{% block content %}
<div class="events-page">
    <div class="events-heading">
        <h1>Events</h1>
        <p class="section-subtitle">Host weddings, celebrations and corporate gatherings at Star Hotel.</p>
    </div>
        <div class="event-list">
        {% for event in events %}
        <div class="event-card" id="event-{{ event.id }}">
            <div class="event-card-image">
                <img src="{% static event.image_path %}" alt="{{ event.title }}">
            </div>

            <div class="event-card-info">
                <h3 class="event-card-name">{{ event.title }}</h3>
                <p class="event-card-description">{{ event.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
