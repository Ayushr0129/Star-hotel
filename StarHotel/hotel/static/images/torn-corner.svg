<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 107" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="125%" height="125%">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="2" result="t"/>
      <feDiffuseLighting in="t" lighting-color="#4b72b6" surfaceScale="1.8" result="l">
        <feDistantLight azimuth="225" elevation="55"/>
      </feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-1" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <g filter="url(#rough)">
    <path d="M-4 0 L17 12 L41 37 L64 59 L79 67 L94 87 L118 111 L118 0 Z" fill="#fff" filter="url(#shadow)"/>
    <path d="M0 0 L21 8 L45 33 L68 55 L83 63 L98 83 L118 107 L118 0 Z" fill="#3c5a90" filter="url(#paper)"/>
  </g>
</svg>
