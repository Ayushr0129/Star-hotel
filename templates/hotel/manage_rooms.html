{% extends "base.html" %}

{% block title %}
Manage Rooms - STAR HOTEL
{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-6 py-8">

  <!-- Page Title & Subtitle -->
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-black mb-2">Rooms Management</h1>
    <p class="text-gray-500 font-medium">Manage rooms availability, pricing and maintenance</p>
  </div>

  <!-- Metrics Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
    
    <!-- Available Card -->
    <div class="border border-gray-300 rounded-xl p-5 flex items-center justify-between shadow-sm">
      <div class="w-12 h-12 rounded-full bg-[#34d399]"></div>
      <div class="text-center pr-6">
        <p class="text-sm font-semibold text-gray-500 mb-1">Available</p>
        <p class="text-2xl font-bold text-black">{{ available_count|default:"45" }}</p>
      </div>
      <div></div>
    </div>
